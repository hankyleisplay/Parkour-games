[package]
name = "parkour-games"
version = "0.1.0"
description = "Cyber Runner 3D - 霓虹極速跑酷 (Tauri + Rust)"
authors = ["hankyleisplay <hankyleisplay@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "parkour_games_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
