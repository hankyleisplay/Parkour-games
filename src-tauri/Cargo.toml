[package]
name = "mario-parkour"
version = "0.3.0"
description = "Retro Arcade 8-in-1 - 八合一全能經典小遊戲平台 (Tauri + Rust)"
authors = ["hankyleisplay <hankyleisplay@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "mario_parkour_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
