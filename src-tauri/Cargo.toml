[package]
name = "mario-parkour"
version = "0.1.0"
description = "Super Mario Parkour - 超級馬力歐跑酷 (Tauri + Rust)"
authors = ["hankyleisplay <hankyleisplay@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "mario_parkour_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
